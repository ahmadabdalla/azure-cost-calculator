# Waza eval task: see docs/ops/evals.md
id: eval:networking/bastion/standard-tier
name: Azure Bastion - Standard Tier
description: >
  Tests monthly cost estimation for an always-on Azure Bastion Standard tier
  host. Validates that the agent states assumptions, uses a 730-hour monthly
  basis for the always-on gateway meter, and produces a monthly total.
tags:
  - happy-path
  - single-service
  - networking
  - service:bastion
inputs:
  prompt: "How much does an Azure Bastion Standard tier host cost per month in East US?"
expected:
  output_contains:
    - "Assumptions"
    - "730"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Azure Bastion|Bastion"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: tier-acknowledged
    config:
      contains:
        - "Standard"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
