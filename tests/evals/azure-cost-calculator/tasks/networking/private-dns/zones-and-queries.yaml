# Waza eval task: see docs/ops/evals.md
id: eval:networking/private-dns/zones-and-queries
name: Private DNS - Zones and Query Volume
description: >
  Tests cost estimation for Private DNS zones with query volume.
  Validates that the agent uses the Azure DNS serviceName with Private SKU
  filter, accounts for zone hosting and per-million query pricing, and
  handles the empty-region workaround.
tags:
  - happy-path
  - single-service
  - networking
  - service:private-dns
inputs:
  prompt: "How much would 10 Private DNS zones cost per month with 5 million DNS queries?"
expected:
  output_contains:
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Private DNS|Private DNS Zone"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: zone-count-acknowledged
    config:
      contains:
        - "10"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "How much would 10 Private DNS zones cost per month with 5 million DNS queries?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct billing model for Private DNS with zone hosting and query components.
        (3) Accounts for 10 zones and 5 million queries as specified.

        If all three criteria are met, call set_waza_grade_pass with a description and reason.
        Otherwise call set_waza_grade_fail with a description and a reason naming the criteria that failed.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
