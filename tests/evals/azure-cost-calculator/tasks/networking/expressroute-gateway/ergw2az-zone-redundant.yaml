# Waza eval task: see docs/ops/evals.md
id: eval:networking/expressroute-gateway/ergw2az-zone-redundant
name: ExpressRoute Gateway - ErGw2AZ Zone-Redundant
description: >
  Tests monthly cost estimation for an ExpressRoute Gateway ErGw2AZ SKU in East US.
  Validates that the agent uses the correct productName filter to isolate gateway
  meters from circuit meters, and accounts for 730-hour monthly billing.
tags:
  - happy-path
  - single-service
  - networking
  - service:expressroute-gateway
inputs:
  prompt: "How much would an ExpressRoute Gateway ErGw2AZ cost per month in East US?"
expected:
  output_contains:
    - "Assumptions"
    - "730"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "ExpressRoute Gateway|ER Gateway"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: sku-acknowledged
    config:
      contains:
        - "ErGw2AZ"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
