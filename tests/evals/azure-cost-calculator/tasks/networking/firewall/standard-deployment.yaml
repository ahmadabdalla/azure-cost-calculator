# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.0/schemas/task.schema.json
id: eval:networking/firewall/standard-deployment
name: Azure Firewall - Standard Deployment
description: >
  Tests monthly cost estimation for an Azure Firewall Standard tier in East US.
  Validates that the response includes assumptions, uses a monthly-hours basis
  for the estimate, and acknowledges the 100 GB data volume in the prompt.
tags:
  - happy-path
  - single-service
  - networking
  - service:firewall
inputs:
  prompt: "How much would an Azure Firewall Standard cost per month in East US with 100 GB of data processed?"
expected:
  output_contains:
    - "Assumptions"
    - "730"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Azure Firewall|AzFW"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: data-volume-acknowledged
    config:
      contains:
        - "100"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
