# Waza eval task: see docs/ops/evals.md
id: eval:networking/traffic-manager/dns-queries-health-checks
name: Traffic Manager - DNS Queries and Health Checks
description: >
  Tests cost estimation for Traffic Manager with DNS queries and Azure endpoint
  health checks. Validates that the agent queries Global region, uses the correct
  SKU filter, and accounts for both DNS query volume and endpoint count.
tags:
  - happy-path
  - single-service
  - networking
  - service:traffic-manager
inputs:
  prompt: "How much would Traffic Manager cost per month with 5 Azure endpoints and 10 million DNS queries?"
expected:
  output_contains:
    - "Assumptions"
    - "730"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Traffic Manager|DNS Load Balancer"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: endpoint-count-acknowledged
    config:
      contains:
        - "5"
    weight: 0.5
  - type: text
    name: global-region-acknowledged
    config:
      contains:
        - "Global"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "How much would Traffic Manager cost per month with 5 Azure endpoints and 10 million DNS queries?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct billing model for Traffic Manager (DNS queries + health checks).
        (3) Accounts for 5 Azure endpoints and 10 million DNS queries as specified.

        Score 1.0 if all three criteria are met. Score 0.5 if two are met. Score 0.0 if fewer than two are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
