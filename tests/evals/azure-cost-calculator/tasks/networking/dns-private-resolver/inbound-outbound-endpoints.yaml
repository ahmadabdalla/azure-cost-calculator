# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.23.0/schemas/task.schema.json
id: eval:networking/dns-private-resolver/inbound-outbound-endpoints
name: DNS Private Resolver - Inbound and Outbound Endpoints
description: >
  Tests cost estimation for a DNS Private Resolver with multiple inbound and
  outbound endpoints. Validates that the agent uses the correct serviceName
  (Azure DNS), filters by skuName 'Private Resolver', handles empty-region
  pricing, and accounts for per-endpoint monthly charges.
tags:
  - happy-path
  - single-service
  - networking
  - service:dns-private-resolver
inputs:
  prompt: "How much would an Azure DNS Private Resolver cost per month with 2 inbound endpoints and 1 outbound endpoint?"
expected:
  output_contains:
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "DNS Private Resolver|Private Resolver"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: endpoint-count-acknowledged
    config:
      contains:
        - "2"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "How much would an Azure DNS Private Resolver cost per month with 2 inbound endpoints and 1 outbound endpoint?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct per-endpoint billing model for DNS Private Resolver.
        (3) Accounts for 2 inbound endpoints and 1 outbound endpoint as specified.

        Score 1.0 if all three criteria are met. Score 0.5 if two are met. Score 0.0 if fewer than two are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
