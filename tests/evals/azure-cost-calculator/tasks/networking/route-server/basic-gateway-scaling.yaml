# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.23.0/schemas/task.schema.json
id: eval:networking/route-server/basic-gateway-scaling
name: Route Server - Basic Gateway with Scaling Units
description: >
  Tests cost estimation for an Azure Route Server deployment supporting 6,000 VMs.
  Validates that the agent queries Global region, separates gateway and scaling unit
  meters, and correctly calculates additional infrastructure units needed.
tags:
  - happy-path
  - single-service
  - networking
  - service:route-server
inputs:
  prompt: "How much would an Azure Route Server cost per month if I have 6,000 VMs in my VNet and peered VNets?"
expected:
  output_contains:
    - "Assumptions"
    - "730"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Route Server|Azure Route Server"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: vm-count-acknowledged
    config:
      contains:
        - "6,000"
    weight: 0.5
  - type: text
    name: global-region-acknowledged
    config:
      contains:
        - "Global"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "How much would an Azure Route Server cost per month if I have 6,000 VMs in my VNet and peered VNets?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Treats Route Server as a global-priced service by using/acknowledging Global region pricing.
        (3) Shows a monthly total cost using the correct billing model for Azure Route Server.
        (4) Accounts for additional routing infrastructure units needed beyond 4,000 VMs (should calculate 2 additional units for 6,000 VMs).

        Score 1.0 if all four criteria are met. Score 0.5 if three are met. Score 0.0 if fewer than three are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
