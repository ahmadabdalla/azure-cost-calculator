# Waza eval task: see docs/ops/evals.md
id: eval:networking/dns-security-policy/domains-and-queries
name: DNS Security Policy - Domains and Queries
description: >
  Tests cost estimation for DNS Security Policy with managed domains and query
  volume. Validates that the agent uses Zone 1 region pricing, separates domain
  and query meters, and accounts for the specified quantities.
tags:
  - happy-path
  - single-service
  - networking
  - service:dns-security-policy
inputs:
  prompt: "How much would DNS Security Policy cost per month for 5,000 domains and 10 million DNS security queries?"
expected:
  output_contains:
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "DNS Security Policy|DNS Security"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: domain-count-acknowledged
    config:
      contains:
        - "5,000"
    weight: 0.5
  - type: text
    name: query-volume-acknowledged
    config:
      contains:
        - "10"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "How much would DNS Security Policy cost per month for 5,000 domains and 10 million DNS security queries?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct billing model for DNS Security Policy (domain units + query volume).
        (3) Accounts for 5,000 domains and 10 million queries as specified.

        Score 1.0 if all three criteria are met. Score 0.5 if two are met. Score 0.0 if fewer than two are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
