# Waza eval task: see docs/ops/evals.md
id: eval:networking/load-balancer/standard-base-plus-data
name: Load Balancer - Standard Base Plus Data Processed
description: >
  Tests monthly cost estimation for a Standard Load Balancer with default rules
  plus processed data. Validates that the agent states assumptions, queries the
  Global-only region (not an ARM region), and combines the hourly base fee (first
  five rules included) with per-GB data processing.
tags:
  - happy-path
  - single-service
  - networking
  - service:load-balancer
inputs:
  prompt: "What is the monthly cost of a Standard Azure Load Balancer with 3 load balancing rules processing 500 GB per month?"
expected:
  output_contains:
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Load Balancer|ALB|LB"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: data-volume-acknowledged
    config:
      contains:
        - "500"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
