# Waza eval task: see docs/ops/evals.md
id: eval:iot/maps/search-transactions
name: Azure Maps - Search Transactions
description: >
  Tests cost estimation for Azure Maps Gen2 Search transactions.
  Validates the agent correctly handles tiered pricing with free grants,
  uses the Location Insights SKU, and scales by transaction quantity.
tags:
  - happy-path
  - single-service
  - iot
  - service:maps
inputs:
  prompt: "How much would 50,000 Azure Maps Search transactions cost per month in East US?"
expected:
  output_contains:
    - "Assumptions"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Azure Maps|Maps"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: transaction-count-acknowledged
    config:
      contains:
        - "50,000"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "How much would 50,000 Azure Maps Search transactions cost per month in East US?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct billing model for Azure Maps (per 1K transactions with free grant deduction).
        (3) Accounts for 50,000 transactions as specified.

        If all three criteria are met, call set_waza_grade_pass with a description and reason.
        Otherwise call set_waza_grade_fail with a description and a reason naming the criteria that failed.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
