# Waza eval task: see docs/ops/evals.md
id: eval:ai-ml/foundry-agents/hosted-compute-4vcpu
name: Happy Path - Foundry Agents Hosted Compute 4 vCPU
description: >
  Tests cost estimation for Foundry Agents hosted compute with vCPU and memory.
  The API serviceName is Foundry Tools (cross-service); queries must filter by
  ProductName to isolate agent meters. Validates the agent handles the hourly
  hosted compute billing model (vCPU and memory billed hourly × 730).
tags:
  - happy-path
  - single-service
  - ai-ml
  - service:foundry-agents
inputs:
  prompt: "Estimate the monthly cost of Foundry Agents hosted compute with 4 vCPUs and 8 GB memory in East US"
expected:
  output_contains:
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Foundry Agents|AI Agents"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: vcpu-count-acknowledged
    config:
      contains:
        - "4"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "Estimate the monthly cost of Foundry Agents hosted compute with 4 vCPUs and 8 GB memory in East US"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct billing model for Foundry Agents (hourly compute × 730).
        (3) Accounts for 4 vCPUs and 8 GB memory as specified.

        Score 1.0 if all three criteria are met. Score 0.5 if two are met. Score 0.0 if fewer than two are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
