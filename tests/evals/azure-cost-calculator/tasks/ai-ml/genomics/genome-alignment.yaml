# Waza eval task: see docs/ops/evals.md
id: eval:ai-ml/genomics/genome-alignment
name: Happy Path - Microsoft Genomics Alignment
description: >
  Tests cost estimation for Microsoft Genomics alignment and variant calling.
  Per-genome flat rate with per-incremental-gigabase volume fee.
  Validates that the agent identifies the service and produces a currency-formatted estimate.
tags:
  - happy-path
  - single-service
  - ai-ml
  - service:genomics
inputs:
  prompt: "What is the monthly cost for Microsoft Genomics to process 5 genomes in East US?"
expected:
  output_contains:
    - "Genomics"
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Microsoft Genomics|Genomics"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: genome-count-acknowledged
    config:
      contains:
        - "5"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
