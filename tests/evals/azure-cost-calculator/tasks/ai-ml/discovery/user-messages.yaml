# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.23.0/schemas/task.schema.json
id: eval:ai-ml/discovery/user-messages
name: Happy Path - Microsoft Discovery User Messages
description: >
  Tests cost estimation for a single-meter, pay-per-user-message consumption
  service. Microsoft Discovery bills one meter (`User Messages`, unitOfMeasure
  `1`) with regional rate variance. Validates that the agent multiplies the
  per-message rate by the message count rather than treating it as hourly.
tags:
  - happy-path
  - single-service
  - ai-ml
  - service:discovery
inputs:
  prompt: "What is the monthly cost for Microsoft Discovery with 10,000 user messages in East US?"
expected:
  output_contains:
    - "Microsoft Discovery"
    - "Assumptions"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Microsoft Discovery|Discovery"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: message-count-acknowledged
    config:
      contains:
        - "10,000"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
