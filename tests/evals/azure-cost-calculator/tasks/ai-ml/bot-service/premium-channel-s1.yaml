# Waza eval task: see docs/ops/evals.md
id: eval:ai-ml/bot-service/premium-channel-s1
name: Happy Path - Bot Service S1 Premium Channels
description: >
  Tests cost estimation for Azure Bot Service S1 premium channel messages.
  Premium channels (DirectLine, Web Chat) are billed per 1K messages at Global region.
  Validates that the agent identifies Bot Service channels and produces a currency-formatted estimate.
tags:
  - happy-path
  - single-service
  - ai-ml
  - service:bot-service
inputs:
  prompt: "What is the monthly cost for Azure Bot Service S1 tier with 50,000 premium channel messages?"
expected:
  output_contains:
    - "Bot Service"
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Bot Service|Bot Framework"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: premium-channels-acknowledged
    config:
      regex_match:
        - "premium|DirectLine|Web Chat|Premium Channel"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
