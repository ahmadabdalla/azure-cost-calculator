# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.23.0/schemas/task.schema.json
id: eval:ai-ml/bot-service/health-bot-standard
name: Happy Path - Health Bot Standard Tier
description: >
  Tests cost estimation for Azure Health Bot Standard tier.
  Standard tier uses daily billing with multiple meters (base fee, MCU overage, message overage).
  Validates that the agent queries the correct MeterName to avoid inflated totals.
tags:
  - happy-path
  - single-service
  - ai-ml
  - service:bot-service
inputs:
  prompt: "What is the monthly cost for Azure Health Bot Standard tier in East US?"
expected:
  output_contains:
    - "Health Bot"
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      contains:
        - "Health Bot"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: standard-tier-acknowledged
    config:
      contains:
        - "Standard"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
