# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.23.0/schemas/task.schema.json
id: eval:ai-ml/ai-services/language-text-analytics
name: Happy Path - AI Services Language Text Analytics
description: >
  Tests cost estimation for Azure AI Services Language text analytics.
  The user provides the sub-service (Language), tier (Standard), and volume
  (100K text records). Validates the agent identifies the correct service
  and produces a priced estimate.
tags:
  - happy-path
  - single-service
  - ai-ml
  - service:ai-services
inputs:
  prompt: "Estimate the monthly cost of Azure AI Services Language text analytics with 100K text records on Standard tier in East US"
expected:
  output_contains:
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Azure AI Services|AI Services|Language"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: volume-acknowledged
    config:
      contains:
        - "100"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "Estimate the monthly cost of Azure AI Services Language text analytics with 100K text records on Standard tier in East US"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct billing model for Azure AI Services.
        (3) Accounts for 100K text records as specified.

        Score 1.0 if all three criteria are met. Score 0.5 if two are met. Score 0.0 if fewer than two are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
