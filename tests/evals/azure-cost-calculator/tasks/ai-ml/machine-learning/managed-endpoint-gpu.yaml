# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.23.0/schemas/task.schema.json
id: eval:ai-ml/machine-learning/managed-endpoint-gpu
name: Happy Path - Machine Learning Managed Endpoint GPU
description: >
  Tests cost estimation for an Azure Machine Learning managed online endpoint
  with GPU instances. NC4asT4 v3 is a common GPU SKU for managed endpoints.
  Validates that the agent correctly filters by ProductName to isolate
  Managed Model Hosting Service meters and scales by instance count.
tags:
  - happy-path
  - single-service
  - ai-ml
  - service:machine-learning
inputs:
  prompt: "Estimate the monthly cost of 2 Azure Machine Learning managed online endpoints using NC4asT4 v3 GPU instances in East US"
expected:
  output_contains:
    - "Assumptions"
    - "730"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Azure Machine Learning|Azure ML"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: instance-count-acknowledged
    config:
      contains:
        - "2"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "Estimate the monthly cost of 2 Azure Machine Learning managed online endpoints using NC4asT4 v3 GPU instances in East US"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct billing model for Azure Machine Learning (hourly endpoint capacity × 730).
        (3) Accounts for 2 instances as specified.

        Score 1.0 if all three criteria are met. Score 0.5 if two are met. Score 0.0 if fewer than two are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
