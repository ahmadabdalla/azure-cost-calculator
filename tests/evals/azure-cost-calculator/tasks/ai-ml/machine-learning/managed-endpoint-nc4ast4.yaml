# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.23.0/schemas/task.schema.json
id: eval:ai-ml/machine-learning/managed-endpoint-nc4ast4
name: Happy Path - Azure Machine Learning Managed Endpoint NC4asT4 v3
description: >
  Tests cost estimation for Azure Machine Learning managed online endpoint.
  Validates correct serviceName filter (Azure Machine Learning), productName isolation
  (Managed Model Hosting Service), and hourly capacity billing model.
tags:
  - happy-path
  - single-service
  - ai-ml
  - service:machine-learning
inputs:
  prompt: "Estimate the monthly cost of 2 Azure Machine Learning managed online endpoints using NC4asT4 v3 GPU instances in East US 2"
expected:
  output_contains:
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Azure Machine Learning|Machine Learning"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: instance-count-acknowledged
    config:
      contains:
        - "2"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "Estimate the monthly cost of 2 Azure Machine Learning managed online endpoints using NC4asT4 v3 GPU instances in East US 2"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using hourly capacity billing (retailPrice × 730 × instanceCount).
        (3) Correctly identifies the NC4asT4 v3 SKU under the Managed Model Hosting Service product.

        Score 1.0 if all three criteria are met. Score 0.5 if two are met. Score 0.0 if fewer than two are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
