# Waza eval task: see docs/ops/evals.md
id: eval:ai-ml/openai-service/gpt-global-tokens
name: Happy Path - Azure OpenAI GPT Global Token Pricing
description: >
  Tests cost estimation for Azure OpenAI GPT model token pricing.
  Validates correct serviceName filter (Foundry Models), productName isolation,
  and per-token billing model with mixed unitOfMeasure.
tags:
  - happy-path
  - single-service
  - ai-ml
  - service:openai-service
inputs:
  prompt: "Estimate the monthly cost of Azure OpenAI GPT-4o with 10 million input tokens and 5 million output tokens using Global deployment in East US"
expected:
  output_contains:
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Foundry Models"
        - "ProductName: Azure OpenAI"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: tokens-acknowledged
    config:
      regex_match:
        - "(?s)(?=.*(10\\s+million|10,?000,?000))(?=.*(5\\s+million|5,?000,?000))"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "Estimate the monthly cost of Azure OpenAI GPT-4o with 10 million input tokens and 5 million output tokens using Global deployment in East US"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct per-token billing model for Azure OpenAI.
        (3) Accounts for both input and output tokens as specified.

        If all three criteria are met, call set_waza_grade_pass with a description and reason.
        Otherwise call set_waza_grade_fail with a description and a reason naming the criteria that failed.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
