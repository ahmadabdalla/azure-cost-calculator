# Waza eval task: see docs/ops/evals.md
id: eval:ai-ml/speech/stt-payg
name: Happy Path - Speech to Text PAYG
description: >
  Tests cost estimation for Azure Speech to Text standard PAYG tier.
  Validates correct serviceName filter (Foundry Tools), productName isolation,
  and per-hour billing model for S1 Speech To Text.
tags:
  - happy-path
  - single-service
  - ai-ml
  - service:speech
inputs:
  prompt: "What is the monthly cost for Azure Speech to Text with 100 audio hours in East US?"
expected:
  output_contains:
    - "Speech"
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Azure Speech|Speech to Text"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: hours-acknowledged
    config:
      contains:
        - "100"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "What is the monthly cost for Azure Speech to Text with 100 audio hours in East US?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct per-hour billing model for Azure Speech.
        (3) Accounts for 100 audio hours as specified.

        If all three criteria are met, call set_waza_grade_pass with a description and reason.
        Otherwise call set_waza_grade_fail with a description and a reason naming the criteria that failed.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
