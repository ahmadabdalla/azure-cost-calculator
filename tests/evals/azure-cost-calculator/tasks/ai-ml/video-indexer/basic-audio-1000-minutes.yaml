# Waza eval task: see docs/ops/evals.md
id: eval:ai-ml/video-indexer/basic-audio-1000-minutes
name: Happy Path - Video Indexer Basic Audio 1000 Minutes
description: >
  Tests cost estimation for Azure Video Indexer Basic Audio Indexing.
  Ensures the response acknowledges 1,000 minutes, uses per-minute billing,
  and calls the Azure pricing script for Video Indexer.
tags:
  - happy-path
  - single-service
  - ai-ml
  - service:video-indexer
inputs:
  prompt: "What is the monthly cost for Azure Video Indexer Basic Audio Indexing processing 1,000 minutes of content in East US?"
expected:
  output_contains:
    - "Video Indexer"
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Azure Video Indexer|Video Indexer"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: minutes-acknowledged
    config:
      contains:
        - "1,000"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "What is the monthly cost for Azure Video Indexer Basic Audio Indexing processing 1,000 minutes of content in East US?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct per-minute billing model for Azure Video Indexer.
        (3) Accounts for 1,000 minutes as specified.

        If all three criteria are met, call set_waza_grade_pass with a description and reason.
        Otherwise call set_waza_grade_fail with a description and a reason naming the criteria that failed.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
