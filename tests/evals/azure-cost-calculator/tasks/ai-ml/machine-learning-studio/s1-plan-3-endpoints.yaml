# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.23.0/schemas/task.schema.json
id: eval:ai-ml/machine-learning-studio/s1-plan-3-endpoints
name: Happy Path - Machine Learning Studio S1 Plan 3 Endpoints
description: >
  Tests cost estimation for Machine Learning Studio S1 plan with 3 web API endpoints.
  Validates daily billing model (1/Day × 30), correct serviceName filter,
  and no-eastus trap handling. Uses South Central US to avoid the no-eastus-meters trap.
tags:
  - happy-path
  - single-service
  - ai-ml
  - service:machine-learning-studio
inputs:
  prompt: "What is the monthly cost for Machine Learning Studio S1 plan with 3 web API endpoints in South Central US?"
expected:
  output_contains:
    - "Machine Learning Studio"
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Machine Learning Studio|ML Studio"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: endpoint-count-acknowledged
    config:
      contains:
        - "3"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "What is the monthly cost for Machine Learning Studio S1 plan with 3 web API endpoints in South Central US?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct daily billing model for Machine Learning Studio (daily rate × 30).
        (3) Accounts for 3 web API endpoints as specified.

        Score 1.0 if all three criteria are met. Score 0.5 if two are met. Score 0.0 if fewer than two are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
