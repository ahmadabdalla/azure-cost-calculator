# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.23.0/schemas/task.schema.json
id: eval:ai-ml/ai-content-understanding/doc-extraction-standard-10k-pages
name: Happy Path - AI Content Understanding Standard Doc Extraction
description: >
  Tests cost estimation for Azure AI Content Understanding document content extraction.
  Uses the cross-service API serviceName (Foundry Tools) with per-1K page billing.
  Validates the agent correctly identifies the service and computes page-based costs.
tags:
  - happy-path
  - single-service
  - ai-ml
  - service:ai-content-understanding
inputs:
  prompt: "What is the monthly cost for Azure AI Content Understanding standard document content extraction processing 10,000 pages in East US?"
expected:
  output_contains:
    - "Content Understanding"
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Content Understanding|AI Content Understanding"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: pages-acknowledged
    config:
      contains:
        - "10,000"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "What is the monthly cost for Azure AI Content Understanding standard document content extraction processing 10,000 pages in East US?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct per-page billing model for Azure AI Content Understanding.
        (3) Accounts for 10,000 pages as specified.

        Score 1.0 if all three criteria are met. Score 0.5 if two are met. Score 0.0 if fewer than two are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
