# Waza eval task: see docs/ops/evals.md
id: eval:storage/data-lake-storage/hot-lrs-storage-with-operations
name: Happy Path - Data Lake Storage Hot LRS with Operations
description: >
  Tests cost estimation for Data Lake Storage Gen2 with HNS enabled.
  Validates that the agent queries the correct productName (Hierarchical Namespace),
  includes both storage and operation costs, and handles the shared serviceName
  'Storage' by filtering with productName.
tags:
  - happy-path
  - single-service
  - storage
  - service:data-lake-storage
inputs:
  prompt: "How much would 500 GB of Azure Data Lake Storage Gen2 with Hot LRS redundancy cost per month in East US, assuming 100,000 write operations and 1,000,000 read operations?"
expected:
  output_contains:
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Data Lake|ADLS"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: storage-size-acknowledged
    config:
      contains:
        - "500"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "How much would 500 GB of Azure Data Lake Storage Gen2 with Hot LRS redundancy cost per month in East US, assuming 100,000 write operations and 1,000,000 read operations?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct billing model for Data Lake Storage Gen2 (per-GB storage + per-10K operations).
        (3) Accounts for 500 GB storage and the specified operation counts.

        If all three criteria are met, call set_waza_grade_pass with a description and reason.
        Otherwise call set_waza_grade_fail with a description and a reason naming the criteria that failed.
    weight: 1.5
