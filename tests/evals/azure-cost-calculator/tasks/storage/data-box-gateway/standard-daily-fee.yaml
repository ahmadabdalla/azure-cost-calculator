# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.0/schemas/task.schema.json
id: eval:storage/data-box-gateway/standard-daily-fee
name: Happy Path - Data Box Gateway Standard Daily Fee
description: >
  Tests cost estimation for Azure Data Box Gateway standard daily service fee.
  Validates that the agent queries with serviceName 'Data Box' and filters by
  productName 'Data Box Gateway', applies daily-to-monthly normalization (×30),
  and handles the shared serviceName correctly.
tags:
  - happy-path
  - single-service
  - storage
  - service:data-box-gateway
inputs:
  prompt: "How much would a single Azure Data Box Gateway appliance cost per month in East US?"
expected:
  output_contains:
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Data Box Gateway|Data Box Virtual Appliance"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: daily-to-monthly-acknowledged
    config:
      contains:
        - "30"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "How much would a single Azure Data Box Gateway appliance cost per month in East US?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct billing model for Data Box Gateway (daily service fee × 30 days).
        (3) Accounts for a single gateway appliance as specified.

        Score 1.0 if all three criteria are met. Score 0.5 if two are met. Score 0.0 if fewer than two are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
