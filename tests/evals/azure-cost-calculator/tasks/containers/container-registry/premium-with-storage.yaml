# Waza eval task: see docs/ops/evals.md
id: eval:containers/container-registry/premium-with-storage
name: Container Registry - Premium with Excess Storage
description: >
  Tests cost estimation for a Premium ACR with excess storage beyond the
  included 500 GB quota. Validates daily billing model (registry unit × 30),
  correct storage deduction, and geo-replication awareness.
tags:
  - happy-path
  - single-service
  - containers
  - service:container-registry
inputs:
  prompt: "How much would an Azure Container Registry Premium tier cost per month with 750 GB of stored images in East US?"
expected:
  output_contains:
    - "Assumptions"
    - "30"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Container Registry|ACR"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: storage-acknowledged
    config:
      contains:
        - "750"
    weight: 0.5
  - type: text
    name: tier-acknowledged
    config:
      contains:
        - "Premium"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
