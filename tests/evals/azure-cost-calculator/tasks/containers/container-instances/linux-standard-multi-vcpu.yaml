# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.0/schemas/task.schema.json
id: eval:containers/container-instances/linux-standard-multi-vcpu
name: Container Instances - Linux Standard Multi-vCPU
description: >
  Tests cost estimation for a standard Linux container group with multiple vCPUs
  and memory. Validates that the agent correctly queries both vCPU and memory
  meters and applies the correct hourly formula (retailPrice × units × 730).
tags:
  - happy-path
  - single-service
  - containers
  - service:container-instances
inputs:
  prompt: "How much would a Linux container group with 4 vCPUs and 8 GB memory cost per month in East US?"
expected:
  output_contains:
    - "Assumptions"
    - "730"
  output_not_contains:
    - "Windows"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Container Instances|ACI"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: vcpu-count-acknowledged
    config:
      contains:
        - "4"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "How much would a Linux container group with 4 vCPUs and 8 GB memory cost per month in East US?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct billing model for Container Instances (vCPU per-hour + memory per-GB-hour).
        (3) Accounts for 4 vCPUs and 8 GB memory as specified.

        Score 1.0 if all three criteria are met. Score 0.5 if two are met. Score 0.0 if fewer than two are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
