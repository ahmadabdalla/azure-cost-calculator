# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.0/schemas/task.schema.json
id: eval:integration/logic-apps/consumption-standard-actions
name: Logic Apps - Consumption Standard Connector Actions
description: >
  Tests cost estimation for Logic Apps Consumption plan with standard connector
  actions. Validates that the agent handles sub-cent per-action pricing correctly
  and uses Quantity to produce a meaningful monthly cost.
tags:
  - happy-path
  - single-service
  - integration
  - service:logic-apps
inputs:
  prompt: "How much would 50,000 Logic Apps standard connector actions per month cost in East US on the Consumption plan?"
expected:
  output_contains:
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Logic Apps|Workflows"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: action-count-acknowledged
    config:
      contains:
        - "50,000"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
