# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.0/schemas/task.schema.json
id: eval:developer-tools/app-configuration/standard-multi-instance
name: App Configuration - Standard Multi-Instance
description: >
  Tests cost estimation for App Configuration Standard tier with multiple instances.
  Validates daily billing model (×30 not ×730), correct tier isolation, and instance
  count scaling. Standard is the most common production tier.
tags:
  - happy-path
  - single-service
  - developer-tools
  - service:app-configuration
inputs:
  prompt: "How much would 2 App Configuration Standard tier stores cost per month in East US?"
expected:
  output_contains:
    - "Assumptions"
    - "30"
  output_not_contains:
    - "730"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "App Configuration|Configuration Store"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: instance-count-acknowledged
    config:
      contains:
        - "2"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
