# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.23.0/schemas/task.schema.json
id: eval:web/cognitive-search/standard-s1-multi-su
name: Cognitive Search - Standard S1 Multi-SU
description: >
  Tests cost estimation for Azure AI Search Standard S1 tier with multiple
  search units. Validates that the agent correctly applies hourly billing
  at 730 hours/month and scales by search unit count.
tags:
  - happy-path
  - single-service
  - web
  - service:cognitive-search
inputs:
  prompt: "How much would an Azure AI Search Standard S1 with 3 search units cost per month in East US?"
expected:
  output_contains:
    - "Assumptions"
    - "730"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Azure AI Search|Azure Cognitive Search|Search Service"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: search-units-acknowledged
    config:
      regex_match:
        - "\\b3\\s+(search units?|SUs?)\\b|\\bInstanceCount\\s*:?\\s*3\\b"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "How much would an Azure AI Search Standard S1 with 3 search units cost per month in East US?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct billing model for Azure AI Search (hourly × 730 × search units).
        (3) Accounts for 3 search units as specified.

        Score 1.0 if all three criteria are met. Score 0.5 if two are met. Score 0.0 if fewer than two are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
