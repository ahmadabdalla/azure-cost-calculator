# Waza eval task: see docs/ops/evals.md
id: eval:communication/voice/direct-routing-minutes
name: Happy Path - ACS Voice Direct Routing Minutes
description: >
  Tests cost estimation for Azure Communication Services Voice Direct
  Routing outbound calling, the only Voice product with real per-minute
  rates. Validates that expected monthly call minutes drive a call total.
tags:
  - happy-path
  - single-service
  - communication
  - service:voice
inputs:
  prompt: "What is the monthly cost for 50,000 outbound minutes of Azure Communication Services Voice Direct Routing?"
expected:
  output_contains:
    - "Direct Routing"
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Azure Communication Services|ACS Voice|Voice Calling|VOIP|Voice"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: minutes-acknowledged
    config:
      contains:
        - "50,000"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
