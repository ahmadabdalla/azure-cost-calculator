# Waza eval task: see docs/ops/evals.md
id: eval:communication/email/transactional-volume
name: Happy Path - ACS Email Transactional Volume
description: >
  Tests cost estimation for Azure Communication Services Email, a sub-cent
  multi-meter service. Requires separate per-email and per-MB data-transferred
  calculations. Validates both cost components are present and summed.
tags:
  - happy-path
  - single-service
  - communication
  - service:email
inputs:
  prompt: "What is the monthly cost for Azure Communication Services Email sending 500,000 emails per month with an average email size of 0.2 MB in East US?"
expected:
  output_contains:
    - "Email"
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Azure Communication Services|ACS Email|Email"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: email-count-acknowledged
    config:
      contains:
        - "500,000"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "What is the monthly cost for Azure Communication Services Email sending 500,000 emails per month with an average email size of 0.2 MB in East US?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct billing model for Azure Communication Services Email (per-email send charge plus per-MB data-transferred charge).
        (3) Accounts for both 500,000 emails and the 0.2 MB average email size in the data-transfer component as specified.

        Score 1.0 if all three criteria are met. Score 0.5 if two are met. Score 0.0 if fewer than two are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
