# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.23.0/schemas/task.schema.json
id: eval:smoke/should-not-trigger
name: Negative Trigger - Unrelated Prompt
description: >
  Validates the skill does NOT activate for prompts completely unrelated
  to Azure pricing or cost estimation.
tags:
  - smoke
  - negative
  - anti-trigger
inputs:
  prompt: "What is the capital of France?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: skill-does-not-activate
    config:
      skill_path: "skills/azure-cost-calculator"
      mode: "negative"
    weight: 1.0
