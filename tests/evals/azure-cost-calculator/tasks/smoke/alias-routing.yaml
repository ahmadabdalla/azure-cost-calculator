# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.0/schemas/task.schema.json
id: eval:smoke/alias-routing
name: Alias Routing - CosmosDB to Azure Cosmos DB
description: >
  Tests that the agent resolves the alias "CosmosDB" to "Azure Cosmos DB" via
  the routing file and asks for required parameters before estimating.
  Throughput and storage are never-assume for Cosmos DB.
tags:
  - smoke
  - routing
  - alias
  - databases
  - service:cosmos-db
inputs:
  prompt: "How much does CosmosDB cost?"
expected:
  output_not_contains:
    - "Monthly ="
    - "Total:"
graders:
  - type: prompt
    name: asks-before-estimating
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to the question: "How much does CosmosDB cost?"

        The agent's response is in the conversation above. Azure Cosmos DB requires the following
        parameters before a price can be calculated: provisioned throughput (RU/s) and storage (GB).
        These are "never-assume" parameters the agent must not guess.

        Review the agent response and score it:
        - Score 1.0 if the agent asks for provisioned throughput (RU/s) and/or storage (GB) and does NOT provide a cost estimate.
        - Score 0.5 if the agent asks for provisioned throughput (RU/s) and/or storage (GB) but also includes a cost estimate.
        - Score 0.0 if the agent provides a cost estimate without asking for provisioned throughput (RU/s) or storage (GB).

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 2.0
  - type: skill_invocation
    name: skill-activated
    config:
      mode: "any_order"
      required_skills:
        - "azure-cost-calculator"
    weight: 1.0
