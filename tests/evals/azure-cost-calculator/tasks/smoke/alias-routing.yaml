# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.23.0/schemas/task.schema.json
id: eval:smoke/alias-routing
name: Alias Routing - CosmosDB to Azure Cosmos DB
description: >
  Tests that the agent correctly resolves the alias "CosmosDB" to
  "Azure Cosmos DB" and locates the correct service reference file.
tags:
  - smoke
  - routing
  - alias
  - databases
  - service:cosmos-db
inputs:
  prompt: "How much does CosmosDB cost for 400 RU/s in East US?"
expected:
  output_contains:
    - "Azure Cosmos DB"
    - "Assumptions"
graders:
  - type: text
    name: resolved-service-name
    config:
      contains:
        - "Azure Cosmos DB"
    weight: 1.5
  - type: text
    name: user-specified-throughput
    config:
      contains:
        - "400"
    weight: 1.0
  - type: skill_invocation
    name: skill-activated
    config:
      mode: "any_order"
      required_skills:
        - "azure-cost-calculator"
    weight: 1.0
