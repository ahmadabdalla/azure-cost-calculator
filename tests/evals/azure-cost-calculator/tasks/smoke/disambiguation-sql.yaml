# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.23.0/schemas/task.schema.json
id: eval:smoke/disambiguation-sql
name: Disambiguation Required - Azure SQL
description: >
  Tests that the agent identifies missing never-assume parameters and asks
  before estimating. "Azure SQL" maps to SQL Database but the user has not
  specified tier, DTU/vCores, or storage size.
tags:
  - smoke
  - disambiguation
  - databases
  - clarification
inputs:
  prompt: "How much does Azure SQL cost?"
expected:
  output_not_contains:
    - "Monthly ="
    - "Total:"
graders:
  - type: prompt
    name: asks-before-estimating
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to the question: "How much does Azure SQL cost?"

        The agent's response is in the conversation above. Azure SQL requires the following
        parameters before a price can be calculated: service tier (Basic, Standard, or Premium),
        capacity (DTU count or vCore count), and storage size. These are "never-assume" parameters
        the agent must not guess.

        Review the agent response and score it:
        - Score 1.0 if the agent asks for at least one missing parameter and does NOT provide a cost estimate.
        - Score 0.5 if the agent asks for clarification but also includes a cost estimate.
        - Score 0.0 if the agent provides a cost estimate without asking for any missing parameters.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 2.0
