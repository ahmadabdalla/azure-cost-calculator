# Waza eval task: see docs/ops/evals.md
id: eval:management/automation/runbook-minutes-with-free-grant
name: Automation - Runbook Minutes with Free Grant
description: >
  Tests cost estimation for Azure Automation runbook job minutes beyond the
  free grant. Validates that the agent correctly applies the 500 free minutes
  deduction and uses sub-cent pricing from the Known Rates table.
tags:
  - happy-path
  - single-service
  - management
  - service:automation
inputs:
  prompt: "How much would Azure Automation cost per month for 1000 runbook job minutes in East US?"
expected:
  output_contains:
    - "Assumptions"
    - "500"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Automation|Runbook"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: free-grant-acknowledged
    config:
      contains:
        - "500"
    weight: 1.0
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "How much would Azure Automation cost per month for 1000 runbook job minutes in East US?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using UnitPrice from the API or Known Rates (not the script MonthlyCost which rounds sub-cent to zero).
        (3) Accounts for the free grant deduction (500 runbook minutes).

        Score 1.0 if all three criteria are met. Score 0.5 if two are met. Score 0.0 if fewer than two are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
