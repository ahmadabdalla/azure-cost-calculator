# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.23.0/schemas/task.schema.json
id: eval:compute/virtual-machines/windows-d4s-v5
name: Happy Path - Virtual Machines D4s v5 Windows
description: >
  Tests cost estimation for a multi-meter service. Windows VMs require
  correct ProductName filtering (series + OS indicator) to avoid returning
  Linux, Spot, or Low Priority pricing. Validates instance count handling
  and the 730-hour formula.
tags:
  - happy-path
  - single-service
  - compute
  - service:virtual-machines
inputs:
  prompt: "Estimate the monthly cost of running 4 Windows Standard_D4s_v5 instances in East US"
expected:
  output_contains:
    - "Assumptions"
    - "730"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Virtual Machines|VMs"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: instance-count-acknowledged
    config:
      contains:
        - "4"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
