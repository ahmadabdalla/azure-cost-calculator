# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: eval:compute/app-service/linux-p1-v3
name: Happy Path - App Service Linux P1 v3
description: >
  Tests a straightforward cost estimation for a well-specified App Service
  request. The user provides tier (P1 v3), OS (Linux), region (East US),
  and instance count (2). No disambiguation should be needed.
tags:
  - happy-path
  - single-service
  - compute
  - service:app-service
inputs:
  prompt: "Estimate the monthly cost of running 2 Linux App Service P1 v3 instances in East US"
config:
  timeout_seconds: 180
expected:
  output_contains:
    - "Assumptions"
    - "730"
    - "Compute"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      contains_cs:
        - "Azure App Service"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: prompt
    name: complete-estimate-quality
    config:
      prompt: >
        You are evaluating an AI agent's response to: "Estimate the monthly cost of running
        2 Linux App Service P1 v3 instances in East US"

        Check the response for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost calculated using the 730-hour formula.
        (3) Accounts for 2 instances as specified.

        Score 1.0 if all three criteria are met. Score 0.5 if two are met. Score 0.0 if fewer than two are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
  - type: behavior
    name: uses-pricing-script
    config:
      required_tools:
        - "get-azure-pricing"
    weight: 1.0
