# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.23.0/schemas/task.schema.json
id: eval:monitoring/scom-managed-instance/paid-endpoints
name: Happy Path - SCOM Managed Instance Paid Endpoints
description: >
  Tests cost estimation for Azure SCOM Managed Instance with paid non-Azure endpoints.
  Validates that the agent uses the correct cross-service serviceName (Azure Monitor),
  filters by ProductName, queries the Global region, and calculates per-endpoint cost.
tags:
  - happy-path
  - single-service
  - monitoring
  - service:scom-managed-instance
inputs:
  prompt: "What is the monthly cost for Azure SCOM Managed Instance monitoring 10 non-Azure endpoints?"
expected:
  output_contains:
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "SCOM Managed Instance|SCOM MI"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: endpoint-count-acknowledged
    config:
      contains:
        - "10"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "What is the monthly cost for Azure SCOM Managed Instance monitoring 10 non-Azure endpoints?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using per-endpoint billing for Azure SCOM Managed Instance.
        (3) Accounts for 10 non-Azure endpoints as specified in the prompt.

        Score 1.0 if all three criteria are met. Score 0.5 if two are met. Score 0.0 if fewer than two are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
