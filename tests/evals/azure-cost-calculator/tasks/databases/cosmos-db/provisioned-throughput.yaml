# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.0/schemas/task.schema.json
id: eval:databases/cosmos-db/provisioned-throughput
name: Happy Path - Cosmos DB Provisioned Throughput
description: >
  Tests cost estimation for a tiered-pricing service with multiple meters.
  Cosmos DB requires separate throughput (RU/s) and storage (GB) calculations.
  Validates that both cost components are present and summed.
tags:
  - happy-path
  - single-service
  - databases
  - service:cosmos-db
inputs:
  prompt: "What is the monthly cost for Azure Cosmos DB with 1000 RU/s provisioned throughput and 50 GB storage in East US?"
expected:
  output_contains:
    - "Azure Cosmos DB"
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      contains:
        - "Azure Cosmos DB"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: throughput-acknowledged
    config:
      contains:
        - "1,000"
    weight: 0.5
  - type: text
    name: storage-acknowledged
    config:
      contains:
        - "50"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
