# Waza eval task: see docs/ops/evals.md
id: eval:databases/horizondb/compute-and-storage
name: Happy Path - HorizonDB Compute and Storage
description: >
  Tests cost estimation for Azure HorizonDB with compute and storage components.
  Validates that the agent correctly queries the shared serviceName with
  productName filtering and returns both compute and storage costs.
tags:
  - happy-path
  - single-service
  - databases
  - service:horizondb
inputs:
  prompt: "What is the monthly cost for Azure HorizonDB with 4 vCores and 100 GB storage in East US?"
expected:
  output_contains:
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "HorizonDB|Horizon DB"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: vcore-count-acknowledged
    config:
      contains:
        - "4"
    weight: 0.5
  - type: text
    name: storage-acknowledged
    config:
      contains:
        - "100"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
