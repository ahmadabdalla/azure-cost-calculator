# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.0/schemas/task.schema.json
id: eval:databases/database-for-mariadb/gp-gen5-compute-storage
name: Happy Path - MariaDB GP Gen5 Compute and Storage
description: >
  Tests cost estimation for Azure Database for MariaDB with General Purpose Gen5 tier.
  Validates vCore-based compute pricing and storage pricing are both present and summed.
tags:
  - happy-path
  - single-service
  - databases
  - service:database-for-mariadb
inputs:
  prompt: "What is the monthly cost for Azure Database for MariaDB with General Purpose Gen5 tier, 4 vCores, and 100 GB storage in East US?"
expected:
  output_contains:
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Azure Database for MariaDB|MariaDB"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: vcore-count-acknowledged
    config:
      contains:
        - "4"
    weight: 0.5
  - type: text
    name: storage-acknowledged
    config:
      contains:
        - "100"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
