# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.0/schemas/task.schema.json
id: eval:databases/cosmos-db-for-postgresql/multi-node-cluster
name: Happy Path - Cosmos DB for PostgreSQL Multi-Node Cluster
description: >
  Tests cost estimation for a multi-node Cosmos DB for PostgreSQL cluster with
  coordinator and worker nodes. Validates that compute (coordinator + workers)
  and storage components are separately estimated and summed.
tags:
  - happy-path
  - single-service
  - databases
  - service:cosmos-db-for-postgresql
inputs:
  prompt: "What is the monthly cost for an Azure Cosmos DB for PostgreSQL cluster with an 8 vCore coordinator node, 3 worker nodes each with 4 vCores, and 512 GiB storage per node in East US?"
expected:
  output_contains:
    - "Cosmos DB for PostgreSQL"
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Cosmos DB for PostgreSQL|Citus|PostgreSQL Hyperscale"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: worker-count-acknowledged
    config:
      contains:
        - "3"
    weight: 0.5
  - type: text
    name: storage-acknowledged
    config:
      contains:
        - "512"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "What is the monthly cost for an Azure Cosmos DB for PostgreSQL cluster with an 8 vCore coordinator node, 3 worker nodes each with 4 vCores, and 512 GiB storage per node in East US?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct billing model for Azure Cosmos DB for PostgreSQL (coordinator compute + worker compute + storage).
        (3) Accounts for 3 worker nodes as specified.

        Score 1.0 if all three criteria are met. Score 0.5 if two are met. Score 0.0 if fewer than two are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
