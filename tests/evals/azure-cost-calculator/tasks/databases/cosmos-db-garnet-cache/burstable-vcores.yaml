# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.0/schemas/task.schema.json
id: eval:databases/cosmos-db-garnet-cache/burstable-vcores
name: Happy Path - Cosmos DB Garnet Cache Burstable vCores
description: >
  Tests cost estimation for Cosmos DB Garnet Cache with General Purpose - Burstable tier.
  Validates that compute (vCore) and disk (Premium SSD) meters are both priced and summed.
tags:
  - happy-path
  - single-service
  - databases
  - service:cosmos-db-garnet-cache
inputs:
  prompt: "What is the monthly cost for Azure Cosmos DB Garnet Cache with 2 vCores on the General Purpose - Burstable tier and 128 GB disk in East US?"
expected:
  output_contains:
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Garnet Cache|Cosmos DB Garnet Cache"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: vcores-acknowledged
    config:
      contains:
        - "2"
    weight: 0.5
  - type: text
    name: disk-size-acknowledged
    config:
      contains:
        - "128"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "What is the monthly cost for Azure Cosmos DB Garnet Cache with 2 vCores on the General Purpose - Burstable tier and 128 GB disk in East US?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct billing model for Cosmos DB Garnet Cache.
        (3) Accounts for 2 vCores and 128 GB disk as specified.

        Score 1.0 if all three criteria are met. Score 0.5 if two are met. Score 0.0 if fewer than two are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
