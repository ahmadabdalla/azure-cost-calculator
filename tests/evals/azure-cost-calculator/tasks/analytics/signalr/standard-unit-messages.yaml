# Waza eval task: see docs/ops/evals.md
id: eval:analytics/signalr/standard-unit-messages
name: SignalR - Standard Tier Unit and Messages
description: >
  Tests cost estimation for Azure SignalR Service with daily-billed units
  and per-million message overage. Validates that the agent correctly handles
  the daily billing model (auto-multiplied by 30) and message quantity scaling.
tags:
  - happy-path
  - single-service
  - analytics
  - service:signalr
inputs:
  prompt: "How much would 5 Azure SignalR Standard units cost per month in East US with 10 million messages overage?"
expected:
  output_contains:
    - "Assumptions"
    - "30"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "SignalR|Azure SignalR Service"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: unit-count-acknowledged
    config:
      contains:
        - "5"
    weight: 0.5
  - type: text
    name: messages-acknowledged
    config:
      contains:
        - "10"
    weight: 0.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
