# Waza eval task: see docs/ops/evals.md
id: eval:analytics/synapse-analytics/dedicated-sql-pool-dwu
name: Happy Path - Azure Synapse Analytics Dedicated SQL Pool DWU
description: >
  Tests cost estimation for an Azure Synapse Analytics dedicated SQL pool.
  Dedicated pools bill per 100 DWU hourly, so a DW1000c tier scales the
  base meter by ten. Validates that the agent queries the dedicated SQL
  pool DWU meter, scales by the requested tier over 730 hours, and returns
  a formatted monthly total.
tags:
  - happy-path
  - single-service
  - analytics
  - service:synapse-analytics
inputs:
  prompt: "What is the monthly cost for an Azure Synapse Analytics dedicated SQL pool at DW1000c running 24/7 in East US?"
expected:
  output_contains:
    - "Assumptions"
    - "730"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Azure Synapse Analytics|Synapse"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: dwu-tier-acknowledged
    config:
      contains:
        - "DW1000c"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "What is the monthly cost for an Azure Synapse Analytics dedicated SQL pool at DW1000c running 24/7 in East US?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct billing model for Azure Synapse Analytics dedicated SQL pool (per 100 DWU hourly rate over 730 hours).
        (3) Accounts for the DW1000c tier as specified (1000 DWU, ten times the base 100 DWU meter).

        Score 1.0 if all three criteria are met. Score 0.5 if two are met. Score 0.0 if fewer than two are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
