# Waza eval task: see docs/ops/evals.md
id: eval:analytics/analysis-services/standard-s1-single-instance
name: Happy Path - Azure Analysis Services Standard S1 Single Instance
description: >
  Tests cost estimation for a single Azure Analysis Services Standard S1
  server running continuously. AAS bills a per-QPU hourly rate per SKU with
  compute and storage included in one meter. Validates that the agent queries
  the S1 meter under the Standard product and reports a monthly total.
tags:
  - happy-path
  - single-service
  - analytics
  - service:analysis-services
inputs:
  prompt: "What is the monthly cost for an Azure Analysis Services Standard S1 instance running continuously in East US?"
expected:
  output_contains:
    - "Analysis Services"
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Azure Analysis Services|Analysis Services|AAS"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: tier-acknowledged
    config:
      contains:
        - "S1"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "What is the monthly cost for an Azure Analysis Services Standard S1 instance running continuously in East US?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct billing model for Azure Analysis Services (per-QPU hourly rate x 730).
        (3) Accounts for the Standard S1 SKU as specified.

        If all three criteria are met, call set_waza_grade_pass with a description and reason.
        Otherwise call set_waza_grade_fail with a description and a reason naming the criteria that failed.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
