# Waza eval task: see docs/ops/evals.md
id: eval:analytics/power-bi-embedded/a4-single-node
name: Happy Path - Power BI Embedded A4 Single Capacity Node
description: >
  Tests cost estimation for a single Power BI Embedded A4 capacity node
  running continuously. Power BI Embedded bills a per-node hourly rate per
  A-SKU under the Power BI Embedded product. Validates that the agent queries
  the A4 Node meter and reports a monthly total scaled by 730 hours.
tags:
  - happy-path
  - single-service
  - analytics
  - service:power-bi-embedded
inputs:
  prompt: "What is the monthly cost for a single Power BI Embedded A4 capacity node running continuously in East US?"
expected:
  output_contains:
    - "Power BI Embedded"
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Power BI Embedded"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: sku-acknowledged
    config:
      contains:
        - "A4"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "What is the monthly cost for a single Power BI Embedded A4 capacity node running continuously in East US?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct billing model for Power BI Embedded (per-node hourly rate x 730).
        (3) Accounts for the A4 SKU (A4 Node meter) as specified.

        If all three criteria are met, call set_waza_grade_pass with a description and reason.
        Otherwise call set_waza_grade_fail with a description and a reason naming the criteria that failed.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
