# Waza eval task: see docs/ops/evals.md
id: eval:security/purview/data-governance-assets
name: Purview - Data Governance Asset Catalog
description: >
  Tests cost estimation for Microsoft Purview Data Governance per-asset billing.
  Purview spans two serviceNames (Microsoft Purview and Azure Purview). Validates
  the agent correctly uses the per-asset daily rate and normalizes to monthly cost.
tags:
  - happy-path
  - single-service
  - security
  - service:purview
inputs:
  prompt: "How much would Microsoft Purview Data Governance cost per month for 1000 governed assets in East US?"
expected:
  output_contains:
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Microsoft Purview|Purview"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: asset-count-acknowledged
    config:
      regex_match:
        - "1[,.]?000|1K|1,000"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "How much would Microsoft Purview Data Governance cost per month for 1000 governed assets in East US?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct billing model for Microsoft Purview (per-asset daily rate normalized to monthly).
        (3) Accounts for 1000 governed assets as specified.

        Score 1.0 if all three criteria are met. Score 0.5 if two are met. Score 0.0 if fewer than two are met.

        Return ONLY a decimal number between 0.0 and 1.0 with no other text.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
