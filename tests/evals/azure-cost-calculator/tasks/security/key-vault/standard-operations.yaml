# Waza eval task: see docs/ops/evals.md
id: eval:security/key-vault/standard-operations
name: Key Vault - Standard Operations
description: >
  Tests cost estimation for Key Vault Standard tier operations.
  Validates the agent correctly filters by ProductName to exclude
  Azure Dedicated HSM and scales by operation count.
tags:
  - happy-path
  - single-service
  - security
  - service:key-vault
inputs:
  prompt: "How much would 5 million Key Vault operations per month cost in East US using Standard tier?"
expected:
  output_contains:
    - "Assumptions"
  output_not_contains:
    - "Summary format"
graders:
  - type: text
    name: correct-service-name
    config:
      regex_match:
        - "Key Vault|AKV"
    weight: 1.0
  - type: text
    name: currency-format
    config:
      regex_match:
        - "\\$[\\d,]+\\.\\d{2}"
    weight: 1.0
  - type: text
    name: operations-acknowledged
    config:
      regex_match:
        - "5[.,]?000[.,]?000|5M|5 million"
    weight: 0.5
  - type: prompt
    name: complete-estimate-quality
    config:
      continue_session: true
      prompt: >
        You are evaluating an AI agent's response to: "How much would 5 million Key Vault operations per month cost in East US using Standard tier?"

        The agent's response is in the conversation above. Check it for these criteria:
        (1) Includes an Assumptions section disclosing safe-default parameters.
        (2) Shows a monthly total cost using the correct billing model for Key Vault (per-10K operations pricing).
        (3) Accounts for 5 million operations as specified.
        (4) Does not include Azure Dedicated HSM pricing in the estimate.

        If all four criteria are met, call set_waza_grade_pass with a description and reason.
        Otherwise call set_waza_grade_fail with a description and a reason naming the criteria that failed.
    weight: 1.5
  - type: tool_constraint
    name: uses-pricing-script
    config:
      expect_tools:
        - tool: bash
          command_pattern: "get-azure-pricing\\.sh"
    weight: 1.0
