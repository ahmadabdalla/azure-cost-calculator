# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.23.0/schemas/eval.schema.json
name: azure-cost-calculator-eval
description: >
  Evaluation suite for the Azure Cost Calculator skill. Validates cost
  estimation accuracy, disambiguation protocol adherence, alias routing,
  and trigger specificity using the Azure Retail Prices API.
skill: azure-cost-calculator
version: "1.0"

# Experiment config: used for controlled before/after SKILL.md experiments.
# Not used in CI. Run on-demand with:
#   waza run --eval tests/evals/azure-cost-calculator/eval-experiment.yaml \
#            --output results/before.json
#
# Assumptions:
#   - Both model and judge_model use claude-sonnet-4.6. Using a different
#     judge would introduce a second variable into the comparison.
#   - trials_per_task: 3 is the minimum for ci95 bands to be meaningful.
#     The compare-experiment.sh script requires these bands to produce a
#     variance-aware verdict.
config:
  trials_per_task: 3
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
  judge_model: claude-sonnet-4.6

# metrics, graders, and tasks must stay in sync with eval.yaml.
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the skill produce a correct and complete cost estimate (or appropriate response) for the given prompt?
  - name: protocol_adherence
    weight: 1.5
    threshold: 0.9
    description: Did the skill follow the disambiguation protocol, disclose assumptions, and use the correct output format?
  - name: trigger_accuracy
    weight: 1.0
    threshold: 1.0
    description: Did the skill correctly activate (or not activate) based on whether the prompt is about Azure pricing?

graders:
  - type: text
    name: no-summary-format
    config:
      not_contains:
        - "Summary format"
    weight: 1.0

tasks:
  - "tasks/*/*.yaml"
  - "tasks/*/*/*.yaml"
