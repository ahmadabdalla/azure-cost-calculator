name: Create Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Tag and release
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'release: ')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-tags: true

      - name: Extract and validate version
        id: version
        run: |
          version=$(.github/scripts/release/extract-version.sh .claude-plugin/plugin.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/release/extract-changelog.sh "$VERSION"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/release/create-tag-and-release.sh "$VERSION" /tmp/release-body.md

