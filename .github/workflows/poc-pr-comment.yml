name: PoC - PR Comment Permissions

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read
  pull-requests: read

jobs:
  post-comment:
    name: Post Test Comment
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post hardcoded PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api \
            repos/${REPO}/issues/${PR_NUMBER}/comments \
            --method POST \
            -f body="<!-- poc-pr-comment -->
          :test_tube: **PoC comment** — job-level \`pull-requests: write\` is working."
