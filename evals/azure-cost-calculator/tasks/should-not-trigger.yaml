# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json
id: negative-trigger-001
name: Negative Trigger - Unrelated Prompt
description: >
  Validates the skill does NOT activate for prompts completely unrelated
  to Azure pricing or cost estimation.
tags:
  - negative
  - anti-trigger
inputs:
  prompt: "What is the capital of France?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: skill-does-not-activate
    config:
      skill_path: "skills/azure-cost-calculator"
      mode: "negative"
    weight: 1.0
