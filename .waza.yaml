# Waza project config: see docs/ops/evals.md

paths:
  skills: skills/
  evals: tests/evals/
  results: results/
defaults:
  engine: copilot-sdk
  model: claude-sonnet-4.6
  timeout: 300
  parallel: false
  workers: 1
  verbose: false
  sessionLog: false
cache:
  enabled: false
  dir: .waza-cache
server:
  port: 3000
  resultsDir: results/
dev:
  model: claude-sonnet-4.6
  target: medium-high
  maxIterations: 5
tokens:
  warningThreshold: 500
  fallbackLimit: 1000
graders:
  programTimeout: 30
storage:
  containerName: waza-results
